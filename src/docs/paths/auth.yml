/auth/login:
  post:
    summary: Login
    tags: [Auth]
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [email, password]
            properties:
              email:
                type: string
                format: email
              password:
                type: string
                format: password
    responses:
      "200":
        description: Authenticated user with access token
        content:
          application/json:
            schema:
              type: object
              properties:
                user:
                  allOf:
                    - $ref: "#/components/schemas/User"
                    - type: object
                      properties:
                        access_token:
                          type: string
      "401":
        $ref: "#/components/responses/Unauthorized"
      "403":
        description: USER role is not allowed to log in
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Error"
