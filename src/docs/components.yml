components:
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          type: string
          enum: [USER, ADMIN, MANAGER]
        access_token:
          type: string
          description: Present on login response only

    Error:
      type: object
      properties:
        code:
          type: number
        message:
          type: string

    Campaign:
      type: object
      description: |
        Campaign from shared DB1. The `htmlBody` field is the API alias for the DB column `emailBody`
        (same convention as the main Campaino Selzy backend).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subject:
          type: string
        link:
          type: string
        ctaText:
          type: string
        emailBody:
          type: string
          description: Database column name
        htmlBody:
          type: string
          description: API alias for emailBody
        domainId:
          type: string
          format: uuid
          nullable: true
        emailListId:
          type: string
          format: uuid
          nullable: true
        templateId:
          type: string
          format: uuid
        templateName:
          type: string
        hasCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Template:
      type: object
      description: Template uses `emailBody` in DB; main backend API exposes it as `htmlBody`.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        subject:
          type: string
        emailBody:
          type: string
        htmlBody:
          type: string
          description: API alias for emailBody
        providerTemplateId:
          type: string
          nullable: true

    CampaignStatsSnapshot:
      type: object
      properties:
        sent:
          type: integer
        delivered:
          type: integer
        uniqueOpens:
          type: integer
        totalOpens:
          type: integer
        uniqueClicks:
          type: integer
        totalClicks:
          type: integer

    CampaignStatsLimits:
      type: object
      properties:
        maxDelivered:
          type: integer
        maxUniqueOpens:
          type: integer
        maxTotalOpens:
          type: integer
          nullable: true
        maxUniqueClicks:
          type: integer
        maxTotalClicks:
          type: integer
          nullable: true

    CampaignCurrentStats:
      allOf:
        - $ref: "#/components/schemas/CampaignStatsSnapshot"
        - type: object
          properties:
            campaignId:
              type: string
              format: uuid
            name:
              type: string
            hasCompleted:
              type: boolean
            limits:
              $ref: "#/components/schemas/CampaignStatsLimits"

    StatsUpdateResponse:
      type: object
      properties:
        before:
          $ref: "#/components/schemas/CampaignStatsSnapshot"
        after:
          $ref: "#/components/schemas/CampaignStatsSnapshot"
        applied:
          $ref: "#/components/schemas/CampaignStatsSnapshot"
        emailSource:
          type: string
          enum: [default_csv, upload, none]
        warnings:
          type: array
          items:
            type: string

    CampaignListResponse:
      type: object
      properties:
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/Campaign"
        totalRecords:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer
        pageLimit:
          type: integer

    CampaignUpdateHistory:
      type: object
      properties:
        id:
          type: string
          format: uuid
        campaignId:
          type: string
          format: uuid
        name:
          type: string
        sent:
          type: integer
        delivered:
          type: integer
        totalOpens:
          type: integer
        uniqueOpens:
          type: integer
        totalClicks:
          type: integer
        uniqueClicks:
          type: integer
        userId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time

    CampaignUpdatesResponse:
      type: object
      properties:
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/CampaignUpdateHistory"
        totalRecords:
          type: integer
        totalPages:
          type: integer
        currentPage:
          type: integer
        pageLimit:
          type: integer

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 401
            message: Please authenticate
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 403
            message: Forbidden
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            code: 404
            message: Not found

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
